services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadgen
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen
    ports:
      - "55432:5432"
    volumes:
      - leadgen-postgres:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - leadgen-redis:/data

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: leadgen-local
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  leadgen-postgres:
  leadgen-redis:
